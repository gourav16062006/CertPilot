<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background container with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Certificate Certificate Sheet -->
  <g filter="url(#shadow)" transform="translate(106, 96)">
    <!-- Certificate Paper -->
    <rect x="0" y="0" width="300" height="230" rx="20" fill="#ffffff"/>
    
    <!-- Outer Certificate Border -->
    <rect x="14" y="14" width="272" height="202" rx="12" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <rect x="20" y="20" width="260" height="190" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Decorative Header Emblem Lines -->
    <rect x="110" y="45" width="80" height="8" rx="4" fill="#2563eb"/>
    <rect x="60" y="80" width="180" height="12" rx="6" fill="#0f172a"/>
    <rect x="80" y="110" width="140" height="6" rx="3" fill="#94a3b8"/>
    <rect x="70" y="130" width="160" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Signatures -->
    <line x1="50" y1="185" x2="110" y2="185" stroke="#94a3b8" stroke-width="2"/>
    <line x1="190" y1="185" x2="250" y2="185" stroke="#94a3b8" stroke-width="2"/>

    <!-- Gold Seal with Pilot Ribbon -->
    <g transform="translate(150, 215)">
      <!-- Ribbons -->
      <polygon points="-24,0 -34,44 -14,34 0,44 -10,0" fill="#dc2626"/>
      <polygon points="10,0 0,44 14,34 34,44 24,0" fill="#b91c1c"/>
      
      <!-- Seal Medal -->
      <circle cx="0" cy="0" r="32" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="3 2"/>

      <!-- Navigation / Pilot Star -->
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#854d0e"/>
    </g>
  </g>
</svg>
